[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnsignal"
version = "0.2.0"
description = "AI security finding quality, triage, remediation, and verified-resolution intelligence"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.37",
    "pandas>=2.0",
]

[project.scripts]
vulnsignal = "vulnsignal.cli:main"

[tool.setuptools.packages.find]
include = ["vulnsignal*"]
